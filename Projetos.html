<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projetos — Breno Zanon</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --vinho:#6B1E35;
      --vinho-escuro:#4A1224;
      --vinho-claro:#8B2A45;
      --beje:#C9B99A;
      --beje-claro:#E8DDD0;
      --cinza:#3A3A3A;
      --fundo:#0F0A0C;
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      cursor:none;
      font-family:'DM Sans', sans-serif;
      background:var(--fundo);
      color:var(--beje-claro);
      overflow-x:hidden;
    }

    /* BACKGROUND */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(107,30,53,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(107,30,53,0.08) 1px, transparent 1px);
      background-size: 42px 42px;
      z-index:0;
    }

    .bg-glow {
      position: fixed;
      width:600px;
      height:600px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(107,30,53,0.2), transparent 70%);
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:0;
    }

    /* CURSOR IGUAL HOME */
    #cursor {
      width: 22px;
      height: 22px;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #cursor-trail {
      width: 44px;
      height: 44px;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.45;
      transition: transform 0.2s ease;
    }

    /* CONTAINER */
    .container {
      position:relative;
      z-index:10;
      max-width:1100px;
      margin:auto;
      padding:3rem 1.5rem;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.65rem 1.2rem;
      border-radius: 10px;
      font-size: 13px;
      color: var(--beje);
      border: 1px solid rgba(201, 185, 154, 0.18);
      text-decoration: none;
      transition: all 0.3s;
    }

    .btn-voltar:hover {
      transform: translateX(-4px);
    }

    h1 {
      font-family:'Syne';
      text-align:center;
      margin-bottom:2.5rem;
      font-size:32px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:1.5rem;
    }

    .card {
      background:linear-gradient(135deg,var(--vinho-escuro),#2E0A16);
      padding:1.5rem;
      border-radius:14px;
      transition:.3s;
    }

    .card:hover {
      transform:translateY(-6px);
    }

    .btn {
      display:inline-block;
      padding:.6rem 1rem;
      background:linear-gradient(135deg,var(--vinho),var(--vinho-escuro));
      border-radius:8px;
      text-decoration:none;
      font-size:13px;
      color:white;
    }

  </style>
</head>

<body>

<!-- CURSOR SVG (IGUAL HOME) -->
<svg id="cursor" viewBox="0 0 22 22">
  <path d="M4 4L10 17L12 12L17 10L4 4Z" fill="#C9B99A" stroke="#6B1E35" stroke-width="1.2"/>
  <circle cx="17" cy="17" r="2.2" fill="#6B1E35"/>
</svg>

<svg id="cursor-trail" viewBox="0 0 44 44">
  <circle cx="22" cy="22" r="18" stroke="#6B1E35" stroke-width="0.6"/>
  <circle cx="22" cy="22" r="7" stroke="#C9B99A" stroke-width="0.5" opacity="0.5"/>
</svg>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<main class="container">

  <a class="btn-voltar" href="Home_Portfolio.html">← Voltar</a>

  <h1>🚀 Meus Projetos</h1>

  <div class="grid">

    <div class="card">
      <h3>Automação Baixa Separação</h3>
      <p>Automação completa de pedidos marketplace.</p>
      <a href="https://github.com/BrenoZG/Automacao_Baixa_Separacao_Pedidos_Marketplace" target="_blank" class="btn">Ver Projeto</a>
    </div>

    <div class="card">
      <h3>Sistema Web Financeiro</h3>
      <p>Gestão financeira com foco analítico.</p>
      <a href="https://github.com/BrenoZG/Sistema_WEB_Gestao_Financas" target="_blank" class="btn">Ver Projeto</a>
    </div>

  </div>

</main>

<script>
const cursor = document.getElementById('cursor');
const trail = document.getElementById('cursor-trail');

let mouseX = 0, mouseY = 0;
let trailX = 0, trailY = 0;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  cursor.style.left = (mouseX - 11) + 'px';
  cursor.style.top  = (mouseY - 11) + 'px';
});

function animateTrail() {
  const smooth = 0.12;

  trailX += (mouseX - trailX) * smooth;
  trailY += (mouseY - trailY) * smooth;

  trail.style.left = (trailX - 22) + 'px';
  trail.style.top  = (trailY - 22) + 'px';

  requestAnimationFrame(animateTrail);
}
animateTrail();

document.querySelectorAll('a, .btn, .card').forEach(el => {
  el.addEventListener('mouseenter', () => {
    cursor.style.transform = 'scale(1.6)';
    trail.style.transform  = 'scale(1.3)';
  });

  el.addEventListener('mouseleave', () => {
    cursor.style.transform = 'scale(1)';
    trail.style.transform  = 'scale(1)';
  });
});

if (window.matchMedia('(pointer: coarse)').matches) {
  cursor.style.display = 'none';
  trail.style.display = 'none';
  document.body.style.cursor = 'auto';
}
</script>

</body>
</html>
