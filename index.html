<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO básico -->
  <title>Breno Zanon | Automação, Dados e IA</title>
  <meta name="description" content="Automação de processos, Python, Power BI, Power Automate, Power Apps e soluções com IA para negócios.">

  <!-- Fonte moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #ffffff;
      --subtext: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      padding: 14px;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .link:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .secondary {
      background: transparent;
      border: 1px solid var(--primary);
    }

    .secondary:hover {
      background: var(--primary);
    }

    .proof {
      margin-top: 20px;
      font-size: 13px;
      color: var(--subtext);
    }

    .footer {
      margin-top: 25px;
      font-size: 11px;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>
  <main class="container">

    <h1>Breno Zanon</h1>

    <p class="subtitle">
      Transformo processos manuais em automações inteligentes com Python, Power BI, Excel, Power Automate, Power Apps e IA.
    </p>

    <div class="links">
      <a class="link" href="sobre.html">👤 Sobre mim</a>
      <a class="link" href="https://github.com/BrenoZG" target="_blank">💻 GitHub</a>
      <a class="link secondary" href="https://www.linkedin.com/in/breno-zanon-bb2118263/" target="_blank">🔗 LinkedIn</a>
      <a class="link secondary" href="https://wa.me/5532984332112?text=Olá%2C%20vi%20seu%20perfil..." target="_blank">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 8px;">
      <path d="M20.52 3.48A11.85 11.85 0 0012.02 0C5.39 0 .02 5.37.02 12c0 2.11.55 4.17 1.59 5.98L0 24l6.18-1.6A11.94 11.94 0 0012.02 24c6.63 0 12-5.37 12-12 0-3.19-1.24-6.19-3.5-8.52z"/>
      </svg>Falar no WhatsApp</a>
    </div>

    <p class="proof">
      + Projetos em automação • Dashboards estratégicos • Integrações com APIs
    </p>

    <div class="footer">
      © 2026 • Desenvolvido por Breno Zanon
    </div>

  </main>
</body>
</html>
