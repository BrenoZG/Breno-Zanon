<!DOCTYPE html>
<html lang="pt-br">
<head>

  <style>
    * {

      padding: 0;

    body {
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      margin-bottom: 25px;
      color: #94a3b8;
    }

    .link {
      display: block;
      margin: 10px 0;
      padding: 14px;
      background: #2563eb;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    .link:hover {
      background: #1d4ed8;
      transform: scale(1.03);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
